# Build and publish ZodOps as a static site on GitLab Pages.
# After the first successful pipeline: Settings → Pages → New domain
# (add the domain you already purchased, then point DNS as GitLab shows).

pages:
  image: node:22
  stage: deploy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - rm -rf public
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
